# Cloudflare Workers Builds (root directory: apps/nextjs)
#   Build command:  pnpm run build
#   Deploy command: npx wrangler deploy --minify
#
# Env vars + secrets: set in Cloudflare dashboard only (Settings → Variables).
# Do NOT commit [vars] here — deploy overwrites dashboard config with wrangler.toml.

name = "blink"
main = ".open-next/worker.js"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "blink"

[observability]
enabled = true

[observability.logs]
enabled = true
