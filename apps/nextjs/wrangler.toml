# Cloudflare Workers Builds (root directory: apps/nextjs)
#   Build command:  pnpm run build
#   Deploy command (production / main):
#     node scripts/ensure-wrangler-hyperdrive.mjs && npx wrangler deploy --minify
#     — or — pnpm run deploy:cloudflare
#   Non-production deploy:
#     node scripts/ensure-wrangler-hyperdrive.mjs && npx wrangler versions upload --preview-alias $WORKERS_CI_BRANCH --minify
#
# OpenNext handler.mjs is ~18 MiB unminified; minify is required on the free 3 MiB plan.
# Even minified, this app typically needs Cloudflare Workers Paid ($5/mo, 10 MiB limit).
# See docs/cloudflare-workers-deploy.md
#
# Env vars + secrets: set in Cloudflare dashboard only (Settings → Variables).
# Do NOT commit [vars] here — deploy overwrites dashboard config with wrangler.toml.

name = "blinkperps"
main = ".open-next/worker.js"
# Minify bundled worker (also set via `wrangler deploy --minify` / deploy:cloudflare script).
minify = true
# Avoid esbuild keepNames injecting __name (breaks client eval on Workers)
keep_names = false
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "blinkperps.xyz"
custom_domain = true

[[routes]]
pattern = "blink.lat"
custom_domain = true

[[routes]]
pattern = "www.blink.lat"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Neon via Hyperdrive — replace id with your config ID from the Cloudflare dashboard.
# Dashboard: Workers & Pages → Hyperdrive → [your config] → copy ID.
# Origin: Neon pooled connection string (Settings → Connection string → pooled).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "8a4f14782e3b4871bb83ea368b886abb"
# Local dev / CI build: direct Neon URL (override via .dev.vars — see .dev.vars.example).
localConnectionString = "postgresql://build:build@127.0.0.1:5432/blink_build"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "blinkperps"

[observability]
enabled = true

[observability.logs]
enabled = true
