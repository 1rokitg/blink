# Cloudflare Workers Builds (root directory: apps/nextjs)
#   Build command:  pnpm run build
#   Deploy command: node scripts/ensure-wrangler-hyperdrive.mjs && npx wrangler deploy
#
# Env vars + secrets: set in Cloudflare dashboard only (Settings → Variables).
# Do NOT commit [vars] here — deploy overwrites dashboard config with wrangler.toml.

name = "blinkperps"
main = ".open-next/worker.js"
# Avoid esbuild keepNames injecting __name (breaks client eval on Workers)
keep_names = false
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "blinkperps.xyz"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Neon via Hyperdrive — replace id with your config ID from the Cloudflare dashboard.
# Dashboard: Workers & Pages → Hyperdrive → [your config] → copy ID.
# Origin: Neon pooled connection string (Settings → Connection string → pooled).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "8a4f14782e3b4871bb83ea368b886abb"
# Local dev / CI build: direct Neon URL (override via .dev.vars — see .dev.vars.example).
localConnectionString = "postgresql://build:build@127.0.0.1:5432/blink_build"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "blinkperps"

[observability]
enabled = true

[observability.logs]
enabled = true
