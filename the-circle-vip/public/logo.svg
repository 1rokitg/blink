<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="The Circle">
  <defs>
    <linearGradient id="circleBrand" x1="18" y1="14" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="42%" stop-color="#6B8CFF"/>
      <stop offset="78%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="circleSheen" x1="36" y1="20" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="circleGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft bloom behind the mark -->
  <circle cx="64" cy="64" r="46" fill="url(#circleBrand)" opacity="0.14" filter="url(#circleGlow)"/>

  <!-- Open ring  gap at 3 o'clock with orbital dot -->
  <path
    d="M96.16 91.99 A42 42 0 1 1 96.16 36.01"
    stroke="url(#circleBrand)"
    stroke-width="17.5"
    stroke-linecap="round"
    filter="url(#circleGlow)"
  />
  <!-- Specular sheen for liquid-glass tubing -->
  <path
    d="M96.16 91.99 A42 42 0 1 1 96.16 36.01"
    stroke="url(#circleSheen)"
    stroke-width="7"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Orbital node in the gap -->
  <circle cx="108.5" cy="64" r="9.25" fill="url(#circleBrand)" filter="url(#circleGlow)"/>
  <circle cx="105.8" cy="61.2" r="3.1" fill="#FFFFFF" opacity="0.55"/>
</svg>
