# Cloudflare Pages / Workers build config (TOML — Cloudflare's standard format).
# Git-connected projects can use this file instead of duplicating settings in the dashboard.
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "blink"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Standard `next build` output. If you adopt @opennextjs/cloudflare, change this path.
pages_build_output_dir = "apps/nextjs/.next"

[build]
command = "pnpm run build --filter=@acme/nextjs"
cwd = "."

# Non-secret vars safe to commit. Set secrets in the Cloudflare dashboard (Build + Production):
#   POSTGRES_URL, BETTER_AUTH_SECRET, STRIPE_SECRET_KEY, TWITTER_CLIENT_SECRET
[vars]
NEXT_PUBLIC_APP_URL = "https://blink.lat"
NEXT_PUBLIC_BUILDER_ADDRESS = "0xc7BcB2EeE9BbFbf875499960746Bc52B2E1A75C6"
NEXT_PUBLIC_BUILDER_FEE_BPS = "100"
NEXT_PUBLIC_PRIVY_APP_ID = "cmphrowed00j20cjuned0ftmt"
NEXT_PUBLIC_GROWTH_MODE = "0"
