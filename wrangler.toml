# Monorepo root deploy config (if deploy runs from repo root).
# Prefer deploying from apps/nextjs with apps/nextjs/wrangler.toml.

name = "blinkperps"
main = "apps/nextjs/.open-next/worker.js"
keep_names = false
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = "apps/nextjs/.open-next/assets"
binding = "ASSETS"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_CONFIG_ID"
localConnectionString = "postgresql://build:build@127.0.0.1:5432/blink_build"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "blinkperps"

[observability]
enabled = true

[observability.logs]
enabled = true
