# Monorepo root deploy config (if deploy runs from repo root).
# Prefer deploying from apps/nextjs with apps/nextjs/wrangler.toml.

name = "blink"
main = "apps/nextjs/.open-next/worker.js"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = "apps/nextjs/.open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "blink"

[observability]
enabled = true

[observability.logs]
enabled = true
